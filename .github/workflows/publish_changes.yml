# Paste this file into `.github/workflows/`
name: Confluence Change Tracking

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: confluence-changelog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate configuration
        env:
          CLOUD_ID: ${{ vars.CONFLUENCE_CLOUD_ID }}
          SPACE_ID: ${{ vars.CONFLUENCE_SPACE_ID }}
          PARENT_ID: ${{ vars.CONFLUENCE_PARENT_PAGE_ID }}
          API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          for name in CLOUD_ID SPACE_ID PARENT_ID API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done
          echo "All configuration values are present."
      - name: Publish change history
        uses: hbhavan-ba/changelog-publisher-dev@main
        with:
          confluence-cloud-id: ${{ vars.CONFLUENCE_CLOUD_ID }}
          confluence-space-id: ${{ vars.CONFLUENCE_SPACE_ID }}
          confluence-parent-page-id: ${{ vars.CONFLUENCE_PARENT_PAGE_ID }}
          confluence-email: ${{ secrets.CONFLUENCE_EMAIL }}
          confluence-api-token: ${{ secrets.CONFLUENCE_API_TOKEN }}
          github-token: ${{ github.token }}
          target-branch: main
